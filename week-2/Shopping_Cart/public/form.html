<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Product</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="container">
    <h1>Add Product</h1>

    <form id="product-form">
      <input type="hidden" id="product-id" />
      <div class="form-group">
        <input type="text" id="name" placeholder="Product Name" required />
        <textarea id="description" placeholder="Description" required></textarea>
        <input type="number" id="price" placeholder="Price" required />
        <input type="number" id="quantity" placeholder="Quantity" required />
        <input type="date" id="date" required />
      </div>
      <div class="form-buttons">
        <button type="submit" id="save-btn" disabled>
          <i class="fa-solid fa-save"></i> Save Product
        </button>
        <button type="button" class="clear" onclick="clearForm()">
          <i class="fa-solid fa-broom"></i> Clear Form
        </button>
      </div>
    </form>

    <a href="products.html" class="nav-link">📋 View Product List</a>

    <!-- Popup Message -->
    <div id="popup" class="popup hidden">✅ Product has been added to the cart!</div>
  </div>

  <script src="form.js"></script>
</body>
</html>
