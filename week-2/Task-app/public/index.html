<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task App</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="header-container">
        <h1>Task Manager</h1>
        <button id="addTaskBtn">Add Task</button>
    </div>
    <table id="tasksTable">
        <thead>
            <tr>
                <th>Title</th>
                <th>Description</th>
                <th>Status</th> 
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <!-- Add/Edit Task Modal -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <h2 id="modalTitle">Add Task</h2>
            <form id="taskForm">
                <input type="hidden" id="taskId">
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" required>
                <label for="description">Description:</label>
                <textarea id="description" name="description" required></textarea>
                <label for="status">Status:</label>
                <select id="status" name="status" required>
                    <option value="Pending">Pending</option>
                    <option value="Completed">Completed</option>
                </select>
                <!-- Make sure your button has an id -->
                <button type="submit" id="saveTaskBtn">Save</button>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeDeleteModal">&times;</span>
            <h2>Confirm Deletion</h2>
            <p>Are you sure you want to delete this task?</p>
            <button id="confirmDeleteBtn">Delete</button>
            <button id="cancelDeleteBtn">Cancel</button>
        </div>
    </div>

    <!-- Edit Confirmation Toast -->
    <div id="editToast" class="modal">
        <div class="modal-content">
            <p>Are you sure you want to edit this task?</p>
            <button id="confirmEditBtn">Yes</button>
            <button id="cancelEditBtn">No</button>
        </div>
    </div>

    <script src="/js/index.js"></script>
</body>
</html>
