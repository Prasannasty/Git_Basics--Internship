<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Home</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #dff6ff, #ffffff);
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      text-align: center;
      background: #ffffff;
      padding: 40px 60px;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease;
    }

    .container:hover {
      transform: scale(1.02);
    }

    h1 {
      color: #2c3e50;
      font-size: 3rem;
      margin-bottom: 30px;
    }

    nav a {
      display: inline-block;
      margin: 12px 20px;
      padding: 12px 24px;
      background: #3498db;
      color: #ffffff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1rem;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    nav a:hover {
      background: #1abc9c;
      transform: translateY(-2px);
    }

    nav a i {
      margin-right: 8px;
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="container">
    <h1>Welcome to the Shopping Cart App</h1>
    <nav>
      <a href="form.html"><i class="fa fa-plus-circle"></i> Add Product</a>
      <a href="products.html"><i class="fa fa-box"></i> View Products</a>
    </nav>
  </div>
</body>
</html>
