<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="notification" style="display:none; position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#2563eb; color:#fff; padding:12px 28px; border-radius:8px; font-size:16px; z-index:1000; box-shadow:0 2px 12px rgba(37,99,235,0.15);"></div>
    
    <h1>To-Do List</h1>
    <div class="input-row">
        <input type="text" id="taskInput" placeholder="Add a new task...">
        <button id="addTaskButton">Add Task</button>
    </div>
    <ul id="taskList"></ul>
    
    <script src="app.js"></script>
</body>
</html>
