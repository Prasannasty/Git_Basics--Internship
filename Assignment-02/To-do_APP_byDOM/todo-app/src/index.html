<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
  <link rel="stylesheet" href="styles.css">
   
</head>
<body>
    <div class="container">

        <button id="addTaskButton">Add Task</button>

    <script src="app.js"></script>
</body>
</html>
